name: Build and push image

# `checks` runs on every PR and push; the image is built only after it passes,
# and never for a pull request. Markdown and agent settings don't change the
# image, so they don't trigger a run.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # There is no build step to catch a typo, and categories.js is a large
      # hand-edited file, so a syntax error would otherwise ship and break the game.
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done

  build-and-push:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davidmoulin250/top-rank-game
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
