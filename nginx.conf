server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # gzip text assets — small but cheap
    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 256;

    # Static assets cache-bust via index meta tags (no-cache headers in HTML).
    # The HTML itself must not be cached so updates roll out immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # JS/CSS can be cached briefly. Updates ship with a redeploy.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
